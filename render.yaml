services:
  - type: web
    name: wastake-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromValue: https://wastake.vercel.app   # cambia por tu URL de Vercel
      - key: SUPABASE_URL
        sync: false   # ingresa manualmente en el dashboard de Render
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
